{% extends 'base.html' %}
{% block content %}
<style>

@page {
    size: A4;
    margin: 0mm; 
}

html, body {
    margin: 0;
    padding: 0;
    background: #f0f0f0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}


.a4-page {
    width: 210mm;
    height: 297mm;
    margin: 10px auto;
    background: white;
    padding: 8mm 10mm; 
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    position: relative;
}


.invoice-copy {
    width: 100%; 
    height: 138mm;
    border: 1.2px solid #000;
    display: flex;
    flex-direction: column;
    background: white;
    box-sizing: border-box;
}


.invoice-copy::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;

    
    background-image: url("{{ url_for('static', filename='shivaji_bg.png') }}");

    background-repeat: no-repeat;
    background-position: center 100%; 
    background-size: 800px; 

    
    opacity: 0.12;

    z-index: 0; 
    pointer-events: none;
}

.invoice-inner {
    position: relative;
    z-index: 1;
    background: transparent;
}


.cut-line {
    border-top: 1px dashed #999;
    text-align: center;
    height: 8mm;

font-size: 10px;
    color: #666;
    display: flex;
    align-items: center;
    justify-content: center;
}


table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed; 
}

th, td {
    border: 1px solid #000;
    padding: 3px 5px;
    font-size: 10.5px;
    line-height: 1.1;
    word-wrap: break-word; 
}

.green-head { background-color: #e8f5e9 !important; font-weight: bold; font-size: 10px; text-align: center; }

.header-logo { width: 50px; }
.company-title { font-size: 13px; font-weight: bold; color: #2e7d32; }

.items-box { flex-grow: 1; }

@media print {
    .no-print { display: none !important; }
    body { background: white; margin: 0; padding: 0; }
    .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        position: absolute;
        left: 0;
        top: 0;
    }
}


.invoice-copy::before {
    content: "";
    position: absolute;

    top: 0; left: 0;
    width: 100%; height: 100%;

    
    background-image: url("{{ url_for('static', filename='shivaji_bg.png') }}");

    background-repeat: no-repeat;
    background-position: center 60%; 
    background-size: 550px; 

    
    opacity: 0.12;

    z-index: 0;
    pointer-events: none;
}


.invoice-inner {
    position: relative;
    z-index: 5;
    background: transparent;
}


.invoice-copy {
    width: 100%;
    height: 138mm;
    border: 1.2px solid #000;
    display: flex;
    flex-direction: column;
    background: white;
    position: relative; 
    overflow: hidden;
    box-sizing: border-box;
}
</style>


<div class="container no-print mt-3 text-center">
    <div class="btn-group shadow">
        <button onclick="window.print()" class="btn btn-success px-5"><i class="bi bi-printer"></i> PRINT INVOICE</button>

      
        <a href="/eway-bill/{{ inv.id }}" class="btn btn-info px-4 text-white">
            <i class="bi bi-truck"></i> E-WAY BILL
        </a>
</a>

    <a href="/edit/{{ inv.id }}" class="btn btn-warning px-4"><i class="bi bi-pencil"></i> EDIT</a>
    <a href="/history" class="btn btn-dark px-4">HISTORY</a>
  </div>
</div>

<div class="a4-page shadow-lg">

  
  <div class="invoice-copy">
    {% set copy_label = "ORIGINAL FOR RECIPIENT" %}
    {% include 'partial_invoice_content.html' %}
  </div>


  <div class="cut-line no-print">
    <i class="bi bi-scissors"></i>
  </div>


  <div class="invoice-copy">
    {% set copy_label = "SHOP COPY (RECORDS)" %}
    {% include 'partial_invoice_content.html' %}
  </div>

</div>
{% endblock %}
